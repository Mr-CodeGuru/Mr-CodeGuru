<svg viewBox="0 0 1000 1152" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="6 projects by Aman Yadav" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --bone:#FFFFFF; --muted:#FFFFFF; --dim:#FFFFFF; --rule:#FFFFFF; --accent:#FFFFFF; --ghost:#FFFFFF; --ink:#FFFFFF; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    
    .row { opacity:0; animation:reveal .55s cubic-bezier(.2,.7,.2,1) forwards; }
    .rule { stroke:var(--ink); stroke-width:1; }
    .title { fill:var(--ink); font-size:17px; font-weight:700; letter-spacing:.8px; }
    .copy { fill:var(--ink); font-size:12px; }
    .meta { fill:var(--ink); font-size:11px; letter-spacing:.4px; }
    @keyframes reveal { from { opacity:0; } to { opacity:1; } }
    .r1{animation-delay:.05s}.r2{animation-delay:.10s}.r3{animation-delay:.15s}.r4{animation-delay:.20s}.r5{animation-delay:.25s}.r6{animation-delay:.30s}
    @media (prefers-reduced-motion: reduce) { .row { animation:none; opacity:1; } }
  </style>
  <g class="mono"><g class="row r1" transform="translate(0 20)"><text class="title" x="48" y="24">01 / ORCHESTRA</text><text class="copy" x="48" y="49">A cloud-native, node-based platform for designing, running and deploying AI pipelines through a visual interface. Models, tools,</text><text class="copy" x="48" y="68">data sources and processing steps connect as modular, reusable nodes, so complex workflows come together without extensive</text><text class="copy" x="48" y="87">boilerplate. Built for both experimentation and production, it supports cloud execution and scalable orchestration, and any</text><text class="copy" x="48" y="106">workflow can be exported as an API endpoint to plug into applications, automate tasks or run as a production service. The goal is</text><text class="copy" x="48" y="125">one environment that carries an idea from rapid prototype to large-scale cloud execution, with flexibility and developer</text><text class="copy" x="48" y="144">experience first.</text><text class="meta" x="48" y="170">NODE-BASED WORKFLOWS · AI PIPELINES · CLOUD EXECUTION · API EXPORT</text><line class="rule" x1="48" y1="188" x2="952" y2="188"/></g><g class="row r2" transform="translate(0 234)"><text class="title" x="48" y="24">02 / LOOMIS</text><text class="copy" x="48" y="49">A fully local, terminal-based code assistant in the spirit of Claude Code and Gemini CLI, but with no cloud dependency. A small</text><text class="copy" x="48" y="68">language model served through llama.cpp answers questions over a codebase using retrieval-augmented generation: code is embedded</text><text class="copy" x="48" y="87">with a code-specialised model into LanceDB, and hybrid vector and full-text search retrieves the relevant chunks from a corpus of</text><text class="copy" x="48" y="106">roughly 70,000. A Rust CLI streams responses into the terminal, a Python sidecar handles embeddings, and a TUI front end is in</text><text class="copy" x="48" y="125">development. Everything runs on-device and stays usable on modest hardware.</text><text class="meta" x="48" y="151">RUST · PYTHON · LANCEDB · LLAMA.CPP · HYBRID RAG · LOCAL SLM</text><line class="rule" x1="48" y1="169" x2="952" y2="169"/></g><g class="row r3" transform="translate(0 429)"><text class="title" x="48" y="24">03 / CONDUIT</text><text class="copy" x="48" y="49">A local-first MCP gateway that sits between AI agent clients such as Claude Desktop and Cursor and multiple backend MCP servers.</text><text class="copy" x="48" y="68">It aggregates and namespaces their tools behind one endpoint, and applies masking, blocking and parameter-mutation rules, with Lua</text><text class="copy" x="48" y="87">hooks for custom behavior, to everything passing through. Built as a Rust workspace with stdio and SSE transports and SQLite</text><text class="copy" x="48" y="106">storage, it ships a SolidJS dashboard embedded in the binary, giving live session inspection and a REST observability API from a</text><text class="copy" x="48" y="125">single local process.</text><text class="meta" x="48" y="151">RUST · SOLIDJS · TYPESCRIPT · SQLITE · AXUM · MCP</text><line class="rule" x1="48" y1="169" x2="952" y2="169"/></g><g class="row r4" transform="translate(0 624)"><text class="title" x="48" y="24">04 / MARKITDOWN-RUST-PY</text><text class="copy" x="48" y="49">A Rust-core reimplementation of MarkItDown, exposed to Python through PyO3. It converts documents such as CSV and HTML into clean</text><text class="copy" x="48" y="68">Markdown with a small memory footprint and fast start-up, aimed at document ingestion pipelines that feed LLM and RAG workflows.</text><text class="copy" x="48" y="87">It is built in phases: the CSV and HTML converters are in place and more formats are on the way, all behind a plain Python</text><text class="copy" x="48" y="106">interface.</text><text class="meta" x="48" y="132">RUST · PYO3 · PYTHON · MARKDOWN</text><line class="rule" x1="48" y1="150" x2="952" y2="150"/></g><g class="row r5" transform="translate(0 800)"><text class="title" x="48" y="24">05 / POSEFIT WEB</text><text class="copy" x="48" y="49">A browser-based AI fitness coach that estimates body pose from the camera feed in real time. A Rust core compiled to WebAssembly</text><text class="copy" x="48" y="68">works alongside MediaPipe to process pose landmarks, and a React interface turns them into live feedback while you exercise. It</text><text class="copy" x="48" y="87">runs as a web app deployed on Vercel, so there is nothing to install and the analysis happens in the browser.</text><text class="meta" x="48" y="113">RUST · WASM · MEDIAPIPE · REACT · VERCEL</text><line class="rule" x1="48" y1="131" x2="952" y2="131"/></g><g class="row r6" transform="translate(0 957)"><text class="title" x="48" y="24">06 / NOVELREAD</text><text class="copy" x="48" y="49">A lightweight, mobile-friendly reading platform for discovering, organizing and reading digital books and documents through a</text><text class="copy" x="48" y="68">clean interface tuned for mobile performance. Built with cloud integration in mind, it lets readers open their library on any</text><text class="copy" x="48" y="87">device, synchronize progress and keep content organized without relying on local storage. The streamlined architecture favors fast</text><text class="copy" x="48" y="106">loading and efficient resource use, so reading stays smooth even on devices with limited resources: simple, portable and</text><text class="copy" x="48" y="125">accessible, with the reach of the cloud.</text><text class="meta" x="48" y="151">MOBILE · CLOUD SYNC · LIGHTWEIGHT · READING</text><line class="rule" x1="48" y1="169" x2="952" y2="169"/></g></g>
</svg>