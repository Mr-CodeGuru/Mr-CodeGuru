<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aman Yadav — AI/ML Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --bone:#FFFFFF; --muted:#FFFFFF; --dim:#FFFFFF; --rule:#FFFFFF; --accent:#FFFFFF; --ghost:#FFFFFF; --ink:#FFFFFF; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(12px); } to { opacity:1;transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.2s} .a2{animation-delay:.5s} .a3{animation-delay:.9s} .a4{animation-delay:1.2s} .a5{animation-delay:1.4s} .a6{animation-delay:1.7s}
    @media (prefers-reduced-motion: reduce) { .draw,.rise,.fade { animation: none; } .draw{stroke-dashoffset:0} .rise,.fade{opacity:1} }
  </style>

  <line class="draw a1" x1="48" y1="58" x2="952" y2="58" stroke="var(--rule)" stroke-width="1"/>
  <g class="fade a1">
    <text class="mono " x="48" y="44" font-size="11" fill="var(--muted)" letter-spacing="3.5">PORTFOLIO — INDEX Nº 001</text>
    <text class="mono " x="952" y="44" font-size="11" fill="var(--muted)" letter-spacing="3.5" text-anchor="end">GUJARAT, IN — 23.0° N</text>
  </g>
  <g class="rise a2"><text class="mono " x="46" y="176" font-size="72" fill="var(--bone)" letter-spacing="-2">Aman Yadav</text></g>
  <g class="fade a3"><text class="mono " x="48" y="214" font-size="19" fill="var(--muted)">AI/ML Engineer — Gujarat, India.</text></g>
  <g class="fade a4">
    <text class="mono " x="48" y="274" font-size="12.5" fill="var(--dim)" letter-spacing="1">focus  ▸</text>
    <text class="mono " x="128" y="274" font-size="12.5" fill="var(--accent)" letter-spacing="1">local-first AI · Rust &amp; Python systems · terminal interfaces · offline agents</text>
  </g>
  <g class="fade a5"><text class="mono " x="48" y="300" font-size="12.5" fill="var(--dim)" letter-spacing="1">builds AI that runs on the hardware people already own</text></g>
  <line class="draw a5" x1="48" y1="342" x2="952" y2="342" stroke="var(--rule)" stroke-width="1"/>
  <g class="fade a6">
    <text class="mono " x="48.0" y="374" font-size="11.5" fill="var(--muted)" letter-spacing="3">RUST &amp; PYTHON</text><text class="mono " x="192.70000000000002" y="374" font-size="11.5" fill="var(--accent)">·</text><text class="mono " x="222.70000000000002" y="374" font-size="11.5" fill="var(--muted)" letter-spacing="3">LOCAL-FIRST AI</text><text class="mono " x="377.3" y="374" font-size="11.5" fill="var(--accent)">·</text><text class="mono " x="407.3" y="374" font-size="11.5" fill="var(--muted)" letter-spacing="3">OFFLINE SYSTEMS</text>
    <text class="mono " x="952" y="374" font-size="11.5" fill="var(--muted)" letter-spacing="3" text-anchor="end">SYSTEMS · AI · TOOLING</text>
  </g>
</svg>