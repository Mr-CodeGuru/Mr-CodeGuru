<svg viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telemetry: language distribution, shipping velocity 2023 to 2026, counters — 60 repositories, 17 projects, 3 open source">
  <style>
    :root { --bone:#000000; --muted:#000000; --dim:#000000; --rule:#000000; --accent:#000000; --ghost:#000000; --ink:#000000; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .g1{transform-origin:48px 0;animation-delay:.25s}.g2{transform-origin:48px 0;animation-delay:.38s}.g3{transform-origin:48px 0;animation-delay:.51s}
    .g4{transform-origin:48px 0;animation-delay:.64s}.g5{transform-origin:48px 0;animation-delay:.77s}.g6{transform-origin:48px 0;animation-delay:.90s}.g7{transform-origin:48px 0;animation-delay:1.03s}
    .spark { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.2s cubic-bezier(.6,0,.2,1) .5s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .dot { opacity: 0; animation: fade .4s ease forwards; }
    .d1{animation-delay:1.0s}.d2{animation-delay:1.3s}.d3{animation-delay:1.6s}.d4{animation-delay:1.9s}.d5{animation-delay:2.2s}.d6{animation-delay:2.5s}
    @keyframes fade { to { opacity: 1; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .n1{animation-delay:.5s}.n2{animation-delay:.7s}.n3{animation-delay:.9s}.n4{animation-delay:1.1s}
    .ping { animation: ping 2.2s ease-out infinite; transform-origin: 622px 105px; }
    @keyframes ping { 0%{transform:scale(.4);opacity:.9} 80%,100%{transform:scale(2.8);opacity:0} }
    @media (prefers-reduced-motion: reduce) { .bar,.spark,.dot,.rise,.ping { animation: none; } .bar{transform:scaleX(1)} .spark{stroke-dashoffset:0} .dot,.rise{opacity:1} .ping{opacity:0} }
  </style>

  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--rule)"/>
  <text class="mono " x="48" y="28" font-size="11" fill="var(--muted)" letter-spacing="3.5">TELEMETRY — WHAT THE HANDS ARE DOING</text>
  <text class="mono " x="952" y="28" font-size="11" fill="var(--muted)" letter-spacing="3.5" text-anchor="end">FIG. 02</text>
  <line x1="360" y1="64" x2="360" y2="296" stroke="var(--rule)" opacity=".4"/>
  <line x1="688" y1="64" x2="688" y2="296" stroke="var(--rule)" opacity=".4"/>

  <!-- language bars: rust 78, python 53, ts 36, html 28, js 17, shell 8, wasm 3 -->
  <text class="mono " x="48" y="76" font-size="10" fill="var(--dim)" letter-spacing="2.5">LANGUAGE DISTRIBUTION · EST.</text>
  <g class="mono" font-size="11">
    <text class="mono " x="48" y="102" font-size="11" fill="var(--bone)">rust</text>         <rect class="bar g1" x="48" y="110" width="230" height="5" fill="var(--accent)"/><text class="mono " x="288" y="117" font-size="10" fill="var(--muted)">35%</text>
    <text class="mono " x="48" y="131" font-size="11" fill="var(--bone)">python</text>       <rect class="bar g2" x="48" y="139" width="158" height="5" fill="var(--bone)"/><text class="mono " x="216" y="146" font-size="10" fill="var(--muted)">24%</text>
    <text class="mono " x="48" y="160" font-size="11" fill="var(--bone)">typescript</text>   <rect class="bar g3" x="48" y="168" width="105" height="5" fill="var(--bone)"/><text class="mono " x="163" y="175" font-size="10" fill="var(--muted)">16%</text>
    <text class="mono " x="48" y="189" font-size="11" fill="var(--bone)">html</text>         <rect class="bar g4" x="48" y="197" width="85"  height="5" fill="var(--bone)"/><text class="mono " x="143" y="204" font-size="10" fill="var(--muted)">13%</text>
    <text class="mono " x="48" y="218" font-size="11" fill="var(--bone)">javascript</text>   <rect class="bar g5" x="48" y="226" width="52"  height="5" fill="var(--bone)"/><text class="mono " x="110" y="233" font-size="10" fill="var(--muted)">8%</text>
    <text class="mono " x="48" y="247" font-size="11" fill="var(--bone)">shell</text>        <rect class="bar g6" x="48" y="255" width="24"  height="5" fill="var(--bone)"/><text class="mono " x="82" y="262" font-size="10" fill="var(--muted)">3%</text>
    <text class="mono " x="48" y="276" font-size="11" fill="var(--bone)">wasm</text>         <rect class="bar g7" x="48" y="284" width="12"  height="5" fill="var(--bone)"/><text class="mono " x="70" y="291" font-size="10" fill="var(--muted)">1%</text>
  </g>

  <!-- shipping velocity -->
  <text class="mono " x="392" y="76" font-size="10" fill="var(--dim)" letter-spacing="2.5">SHIPPING VELOCITY · 2023 → 2026</text>
  <g>
    <line x1="392" y1="252" x2="656" y2="252" stroke="var(--rule)"/>
    <polyline class="spark" points="392,245 440,235 488,212 536,178 584,136 622,105 656,84" stroke="var(--accent)" stroke-width="1.5" fill="none"/>
    <circle class="dot d1" cx="440" cy="235" r="2.5" fill="var(--bone)"/>
    <circle class="dot d2" cx="488" cy="212" r="2.5" fill="var(--bone)"/>
    <circle class="dot d3" cx="536" cy="178" r="2.5" fill="var(--bone)"/>
    <circle class="dot d4" cx="584" cy="136" r="2.5" fill="var(--bone)"/>
    <circle class="ping" cx="622" cy="105" r="4" stroke="var(--accent)" fill="none"/>
    <circle class="dot d5" cx="622" cy="105" r="3" fill="var(--accent)"/>
    <text class="mono " x="392" y="272" font-size="9.5" fill="var(--dim)" letter-spacing="1.5">'23</text>
    <text class="mono " x="475" y="272" font-size="9.5" fill="var(--dim)" letter-spacing="1.5">'24</text>
    <text class="mono " x="560" y="272" font-size="9.5" fill="var(--dim)" letter-spacing="1.5">'25</text>
    <text class="mono " x="640" y="272" font-size="9.5" fill="var(--dim)" letter-spacing="1.5">'26</text>
    <g class="dot d6">
      <text class="mono " x="392" y="300" font-size="10" fill="var(--accent)" letter-spacing="1.5">trend — accelerating</text>
    </g>
  </g>

  <!-- profile counters -->
  <g>
    <g class="rise n1">
      <text class="mono " x="720" y="118" font-size="44" fill="var(--bone)">60</text>
      <text class="mono " x="790" y="112" font-size="10" fill="var(--muted)" letter-spacing="2.5">REPOSITORIES</text>
    </g>
    <g class="rise n2">
      <text class="mono " x="720" y="178" font-size="44" fill="var(--bone)">17</text>
      <text class="mono " x="790" y="172" font-size="10" fill="var(--muted)" letter-spacing="2.5">PROJECTS DOCUMENTED</text>
    </g>
    <g class="rise n3">
      <text class="mono " x="720" y="238" font-size="44" fill="var(--bone)">3</text>
      <text class="mono " x="790" y="232" font-size="10" fill="var(--muted)" letter-spacing="2.5">OPEN SOURCE</text>
    </g>
    <g class="rise n4">
      <text class="mono " x="718" y="298" font-size="44" fill="var(--accent)">∞</text>
      <text class="mono " x="790" y="292" font-size="10" fill="var(--muted)" letter-spacing="2.5">INFINITE IDEAS MORE</text>
    </g>
  </g>
</svg>
