<svg viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline: 2023 B.Tech, July 2026 Kody Technolab, 2026 projects, now, 2027 graduation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --bone:#FFFFFF; --muted:#FFFFFF; --dim:#FFFFFF; --rule:#FFFFFF; --accent:#FFFFFF; --ghost:#FFFFFF; --ink:#FFFFFF; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    
    .axis { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 1110; stroke-dashoffset: 1110; animation: draw 2.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .m { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .m1{animation-delay:.4s}.m2{animation-delay:1.0s}.m3{animation-delay:1.6s}.m4{animation-delay:2.0s}.m5{animation-delay:2.4s}
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .ring { animation: ring 2.6s ease-out infinite; transform-origin: 960px 125px; }
    @keyframes ring { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(3);opacity:0} }
    @media (prefers-reduced-motion: reduce) { .axis,.m,.pulse,.ring { animation: none; } .axis{stroke-dashoffset:0} .m{opacity:1} .ring{opacity:0} }
  </style>

  <line x1="48" y1="40" x2="1152" y2="40" stroke="var(--rule)"/>
  <text class="mono " x="48" y="28" font-size="11" fill="var(--muted)" letter-spacing="3.5">THE ROUTE SO FAR</text>
  <text class="mono " x="1152" y="28" font-size="11" fill="var(--muted)" letter-spacing="3.5" text-anchor="end">FIG. 02</text>
  <line class="axis" x1="48" y1="125" x2="1158" y2="125"/>
  <g class="m m1"><circle cx="110" cy="125" r="4" fill="var(--bone)"/><line x1="110" y1="121" x2="110" y2="96" stroke="var(--rule)"/><text class="mono " x="110" y="74" font-size="11" fill="var(--accent)" letter-spacing="2" text-anchor="middle">2023</text><text class="mono " x="110" y="90" font-size="10.5" fill="var(--bone)" letter-spacing="1" text-anchor="middle">B.Tech CE (AI) · UVPCE</text></g>
  <g class="m m2"><circle cx="370" cy="125" r="4" fill="var(--bone)"/><line x1="370" y1="129" x2="370" y2="154" stroke="var(--rule)"/><text class="mono " x="370" y="172" font-size="11" fill="var(--accent)" letter-spacing="2" text-anchor="middle">JUL 2026</text><text class="mono " x="370" y="188" font-size="10.5" fill="var(--bone)" letter-spacing="1" text-anchor="middle">Python AI/ML · Kody Technolab</text></g>
  <g class="m m3"><circle cx="640" cy="125" r="4" fill="var(--bone)"/><line x1="640" y1="121" x2="640" y2="96" stroke="var(--rule)"/><text class="mono " x="640" y="74" font-size="11" fill="var(--accent)" letter-spacing="2" text-anchor="middle">2026</text><text class="mono " x="640" y="90" font-size="10.5" fill="var(--bone)" letter-spacing="1" text-anchor="middle">Loomis · Conduit · PoseFit Web</text></g>
  <g class="m m4"><circle class="ring" cx="960" cy="125" r="4" stroke="var(--accent)" fill="none"/><circle class="pulse" cx="960" cy="125" r="4.5" fill="var(--accent)"/><line x1="960" y1="129" x2="960" y2="154" stroke="var(--rule)"/><text class="mono " x="960" y="172" font-size="11" fill="var(--accent)" letter-spacing="2" text-anchor="middle">NOW</text><text class="mono " x="960" y="188" font-size="10.5" fill="var(--bone)" letter-spacing="1" text-anchor="middle">3rd yr · CGPA 8.7+ · building</text></g>
  <g class="m m5"><circle cx="1152" cy="125" r="3" fill="var(--dim)"/>
    <text class="mono " x="1152" y="105" font-size="10" fill="var(--dim)" letter-spacing="2" text-anchor="end">2027 →</text>
    <text class="mono " x="1152" y="150" font-size="13" fill="var(--dim)" text-anchor="end">the next build</text></g>
</svg>
