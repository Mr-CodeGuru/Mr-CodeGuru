<svg viewBox="0 0 1000 236" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami — focus, building, principle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --bone:#FFFFFF; --muted:#FFFFFF; --dim:#FFFFFF; --rule:#FFFFFF; --accent:#FFFFFF; --ghost:#FFFFFF; --ink:#FFFFFF; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.35s} .a4{animation-delay:.5s} .a5{animation-delay:.65s} .a6{animation-delay:.8s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <text class="mono rise a1" x="48" y="32" font-size="16" fill="var(--bone)">I build AI systems that run where people already are: offline, lightweight and private.</text>
  <text class="mono rise a2" x="48" y="60" font-size="16" fill="var(--bone)">Rust cores, Python orchestration, small language models, and thin interfaces on top.</text>
  <text class="mono rise a3" x="48" y="88" font-size="15" fill="var(--muted)">drawn to software that runs offline on modest hardware. small binaries, low memory, no cloud.</text>
  <line class="rise a4" x1="48" y1="116" x2="952" y2="116" stroke="var(--rule)" stroke-width="1" opacity=".5"/>
  <text class="mono rise a4" x="48" y="148" font-size="11" fill="var(--muted)" letter-spacing="2.5">FOCUS</text>
  <text class="mono rise a4" x="154" y="148" font-size="15" fill="var(--bone)">Local-first AI · Rust &amp; Python systems · Offline agents · Terminal UI</text>
  <text class="mono rise a5" x="48" y="182" font-size="11" fill="var(--muted)" letter-spacing="2.5">BUILDING</text>
  <text class="mono rise a5" x="154" y="182" font-size="15" fill="var(--accent)">Agents · workflow platforms · RAG tooling · browser &amp; mobile apps</text>
  <text class="mono rise a6" x="48" y="216" font-size="11" fill="var(--muted)" letter-spacing="2.5">PRINCIPLE</text>
  <text class="mono rise a6" x="154" y="216" font-size="15" fill="var(--bone)">local-first by default, cloud as an optional upgrade</text>
</svg>
