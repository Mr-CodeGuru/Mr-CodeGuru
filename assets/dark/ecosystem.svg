<svg viewBox="0 0 1000 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System map: local-first AI projects around one build pipeline">
  <style>
    :root { --bone:#FFFFFF; --muted:#FFFFFF; --dim:#FFFFFF; --rule:#FFFFFF; --accent:#FFFFFF; --ghost:#FFFFFF; --ink:#FFFFFF; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    
    .node { fill: none; stroke: var(--rule); stroke-width: 1; }
    .wire { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 500; stroke-dashoffset: 500; animation: draw 1.6s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .w1{animation-delay:.2s}.w2{animation-delay:.32s}.w3{animation-delay:.44s}.w4{animation-delay:.56s}.w5{animation-delay:.68s}.w6{animation-delay:.8s}
    .flow { stroke: var(--muted); stroke-width: 1; opacity: .2; stroke-dasharray: 3 9; animation: march 1.4s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -12; } }
    .pop { opacity: 0; animation: pop .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes pop { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .p0{animation-delay:.1s}.p1{animation-delay:.9s}.p2{animation-delay:1.0s}.p3{animation-delay:1.1s}.p4{animation-delay:1.2s}.p5{animation-delay:1.3s}.p6{animation-delay:1.4s}.p10{animation-delay:1.9s}
    .core { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:1} 50%{opacity:.55} }
    @media (prefers-reduced-motion: reduce) { .wire,.flow,.pop,.core { animation: none; } .wire{stroke-dashoffset:0} .pop{opacity:1} .flow{opacity:.1} }
  </style>

  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--rule)"/>
  <text class="mono " x="48" y="28" font-size="11" fill="var(--muted)" letter-spacing="3.5">SYSTEM MAP — RUST CORE, THIN SHELLS</text>
  <text class="mono " x="952" y="28" font-size="11" fill="var(--muted)" letter-spacing="3.5" text-anchor="end">FIG. 01</text>
  <g><line class="wire w1" x1="425" y1="222" x2="228" y2="149"/><line class="wire w2" x1="575" y1="222" x2="772" y2="149"/><line class="wire w3" x1="425" y1="278" x2="228" y2="351"/><line class="wire w4" x1="575" y1="278" x2="772" y2="351"/><line class="wire w5" x1="500" y1="222" x2="500" y2="132"/><line class="wire w6" x1="500" y1="278" x2="500" y2="395"/></g>
  <g><line class="flow" x1="425" y1="222" x2="228" y2="149"/><line class="flow" x1="575" y1="222" x2="772" y2="149"/><line class="flow" x1="425" y1="278" x2="228" y2="351"/><line class="flow" x1="575" y1="278" x2="772" y2="351"/><line class="flow" x1="500" y1="222" x2="500" y2="132"/><line class="flow" x1="500" y1="278" x2="500" y2="395"/></g>
  <g class="pop p0 core">
    <rect class="node" x="405" y="222" width="190" height="56" rx="2"/>
    <text class="mono " x="500" y="246" font-size="13" fill="var(--bone)" letter-spacing="2" text-anchor="middle">AMAN.SYS</text>
    <text class="mono " x="500" y="264" font-size="8.5" fill="var(--muted)" letter-spacing="0.5" text-anchor="middle">rust core · python glue · thin ui</text>
  </g>
  <g class="pop p1"><rect class="node" x="50" y="95" width="210" height="54" rx="2"/><text class="mono " x="155.0" y="118" font-size="12" fill="var(--bone)" letter-spacing="1" text-anchor="middle">loomis</text><text class="mono " x="155.0" y="137" font-size="9" fill="var(--muted)" letter-spacing="1" text-anchor="middle">Rust · LanceDB · llama.cpp</text></g><text class="mono pop p10" x="155.0" y="81" font-size="10" fill="var(--accent)" letter-spacing="3" text-anchor="middle">LOCAL AI</text><g class="pop p2"><rect class="node" x="740" y="95" width="210" height="54" rx="2"/><text class="mono " x="845.0" y="118" font-size="12" fill="var(--bone)" letter-spacing="1" text-anchor="middle">conduit</text><text class="mono " x="845.0" y="137" font-size="9" fill="var(--muted)" letter-spacing="1" text-anchor="middle">Rust · SolidJS · MCP</text></g><text class="mono pop p10" x="845.0" y="81" font-size="10" fill="var(--accent)" letter-spacing="3" text-anchor="middle">AGENT TOOLING</text><g class="pop p3"><rect class="node" x="50" y="351" width="210" height="54" rx="2"/><text class="mono " x="155.0" y="374" font-size="12" fill="var(--bone)" letter-spacing="1" text-anchor="middle">markitdown-rust-py</text><text class="mono " x="155.0" y="393" font-size="9" fill="var(--muted)" letter-spacing="1" text-anchor="middle">Rust core · PyO3</text></g><text class="mono pop p10" x="155.0" y="337" font-size="10" fill="var(--accent)" letter-spacing="3" text-anchor="middle">RUST ↔ PYTHON</text><g class="pop p4"><rect class="node" x="740" y="351" width="210" height="54" rx="2"/><text class="mono " x="845.0" y="374" font-size="12" fill="var(--bone)" letter-spacing="1" text-anchor="middle">posefit web</text><text class="mono " x="845.0" y="393" font-size="9" fill="var(--muted)" letter-spacing="1" text-anchor="middle">Rust→WASM · MediaPipe</text></g><text class="mono pop p10" x="845.0" y="337" font-size="10" fill="var(--accent)" letter-spacing="3" text-anchor="middle">BROWSER AI</text><g class="pop p5"><rect class="node" x="395" y="78" width="210" height="54" rx="2"/><text class="mono " x="500.0" y="101" font-size="12" fill="var(--bone)" letter-spacing="1" text-anchor="middle">kody technolab</text><text class="mono " x="500.0" y="120" font-size="9" fill="var(--muted)" letter-spacing="1" text-anchor="middle">Python AI/ML · work</text></g><text class="mono pop p10" x="500.0" y="64" font-size="10" fill="var(--accent)" letter-spacing="3" text-anchor="middle">WORK</text><g class="pop p6"><rect class="node" x="395" y="395" width="210" height="54" rx="2"/><text class="mono " x="500.0" y="418" font-size="12" fill="var(--bone)" letter-spacing="1" text-anchor="middle">ganpat university</text><text class="mono " x="500.0" y="437" font-size="9" fill="var(--muted)" letter-spacing="1" text-anchor="middle">B.Tech CE (AI) · 2027</text></g><text class="mono pop p10" x="500.0" y="471" font-size="10" fill="var(--accent)" letter-spacing="3" text-anchor="middle">STUDY</text>
</svg>
