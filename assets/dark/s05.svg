<svg viewBox="0 0 1000 92" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section 05 — STACK" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --bone:#FFFFFF; --muted:#FFFFFF; --dim:#FFFFFF; --rule:#FFFFFF; --accent:#FFFFFF; --ghost:#FFFFFF; --ink:#FFFFFF; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    
    .draw { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 900; stroke-dashoffset: 900; animation: d 1.3s cubic-bezier(.6,0,.2,1) .2s forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .f { opacity: 0; animation: f .8s ease .1s forwards; }
    @keyframes f { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .draw,.f { animation: none; } .draw { stroke-dashoffset: 0; } .f { opacity: 1; } }
  </style>
  <g class="f">
    <text class="mono " x="48" y="68" font-size="52" fill="var(--ghost)">05</text>
    <text class="mono " x="128" y="58" font-size="14" fill="var(--accent)" letter-spacing="6">STACK</text>
    <text class="mono " x="952" y="58" font-size="11" fill="var(--muted)" letter-spacing="2" text-anchor="end">~/05-stack</text>
  </g>
  <line class="draw" x1="230" y1="53" x2="842" y2="53"/>
</svg>
