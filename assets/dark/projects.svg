<svg viewBox="0 0 1000 336" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four projects by Aman Yadav">
  <style>
    :root { --bone:#FFFFFF; --muted:#FFFFFF; --dim:#FFFFFF; --rule:#FFFFFF; --accent:#FFFFFF; --ghost:#FFFFFF; --ink:#FFFFFF; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    
    .row { opacity:0; animation:reveal .55s cubic-bezier(.2,.7,.2,1) forwards; }
    .rule { stroke:var(--ink); stroke-width:1; }
    .title { fill:var(--ink); font-size:17px; font-weight:700; letter-spacing:.8px; }
    .meta { fill:var(--ink); font-size:11px; letter-spacing:.4px; }
    @keyframes reveal { from { opacity:0; } to { opacity:1; } }
    .r1{animation-delay:.05s}.r2{animation-delay:.10s}.r3{animation-delay:.15s}.r4{animation-delay:.20s}
    @media (prefers-reduced-motion: reduce) { .row { animation:none; opacity:1; } }
  </style>
  <g class="mono"><g class="row r1" transform="translate(0 20)"><text class="title" x="48" y="24">01 / LOOMIS</text><text class="meta" x="48" y="48">RUST · PYTHON · LANCEDB · LLAMA.CPP · HYBRID RAG · LOCAL SLM</text><line class="rule" x1="48" y1="66" x2="952" y2="66"/></g><g class="row r2" transform="translate(0 98)"><text class="title" x="48" y="24">02 / CONDUIT</text><text class="meta" x="48" y="48">RUST · SOLIDJS · TYPESCRIPT · SQLITE · AXUM · MCP</text><line class="rule" x1="48" y1="66" x2="952" y2="66"/></g><g class="row r3" transform="translate(0 176)"><text class="title" x="48" y="24">03 / MARKITDOWN-RUST-PY</text><text class="meta" x="48" y="48">RUST · PYO3 · PYTHON · MARKDOWN</text><line class="rule" x1="48" y1="66" x2="952" y2="66"/></g><g class="row r4" transform="translate(0 254)"><text class="title" x="48" y="24">04 / POSEFIT WEB</text><text class="meta" x="48" y="48">RUST · WASM · MEDIAPIPE · REACT · VERCEL</text><line class="rule" x1="48" y1="66" x2="952" y2="66"/></g></g>
</svg>
