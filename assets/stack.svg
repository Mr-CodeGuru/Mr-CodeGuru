<svg viewBox="0 0 1000 202" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack — languages, ai / ml, systems, web, data, tooling">
  <style>
    :root { --bone:#000000; --muted:#000000; --dim:#000000; --rule:#000000; --accent:#000000; --ghost:#000000; --ink:#000000; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(6px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.3s} .a4{animation-delay:.4s} .a5{animation-delay:.5s} .a6{animation-delay:.6s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>
  <line x1="138" y1="8" x2="138" y2="194" stroke="var(--rule)" stroke-width="1" opacity=".4"/>
  <text class="mono rise a1" x="48" y="32" font-size="12" fill="var(--muted)" letter-spacing="2">LANGUAGES</text><text class="mono rise a1" x="154" y="32" font-size="15" fill="var(--bone)">Rust · Python · TypeScript · JavaScript</text>
  <text class="mono rise a2" x="48" y="64" font-size="12" fill="var(--muted)" letter-spacing="2">AI / ML</text><text class="mono rise a2" x="154" y="64" font-size="15" fill="var(--bone)">Small language models · GGUF · llama.cpp · hybrid RAG · MediaPipe</text>
  <text class="mono rise a3" x="48" y="96" font-size="12" fill="var(--muted)" letter-spacing="2">SYSTEMS</text><text class="mono rise a3" x="154" y="96" font-size="15" fill="var(--bone)">Tokio · Axum · PyO3 · WebAssembly · JSON-RPC · MCP</text>
  <text class="mono rise a4" x="48" y="128" font-size="12" fill="var(--muted)" letter-spacing="2">WEB</text><text class="mono rise a4" x="154" y="128" font-size="15" fill="var(--bone)">React · SolidJS · Next.js · Tailwind</text>
  <text class="mono rise a5" x="48" y="160" font-size="12" fill="var(--muted)" letter-spacing="2">DATA</text><text class="mono rise a5" x="154" y="160" font-size="15" fill="var(--bone)">SQLite · LanceDB · PostgreSQL</text>
  <text class="mono rise a6" x="48" y="192" font-size="12" fill="var(--muted)" letter-spacing="2">TOOLING</text><text class="mono rise a6" x="154" y="192" font-size="15" fill="var(--bone)">Git · Docker · uv · Vercel</text>
  
</svg>
